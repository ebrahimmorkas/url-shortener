server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: url-shortener
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortener_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast so a Redis outage degrades to DB reads instead of stalling redirects
      timeout: 200ms
      connect-timeout: 500ms

app:
  # Public origin used to build short URLs; also used to reject links pointing back at ourselves.
  base-url: ${BASE_URL:http://localhost:8080}
  cache:
    link-ttl: 24h
    missing-ttl: 60s
  clicks:
    # How often buffered click counts are written from Redis to PostgreSQL
    flush-interval: 5s
  rate-limit:
    enabled: true
    policies:
      create-link:
        limit: ${RATE_LIMIT_CREATE:20}
        window: 1m
      # Generous for humans, but slows down bots scanning for valid codes
      redirect:
        limit: ${RATE_LIMIT_REDIRECT:600}
        window: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
